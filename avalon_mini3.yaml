        name: "<DEVICE NAME>.MAC_Address"
        icon: mdi:ethernet
        state: >
            {% set version = state_attr('sensor.<DEVICE NAME>_api_version', 'VERSION') %}
            {{ version[0]['MAC'] if version and 'MAC' in version[0] else 'n/a' }}
        availability: >
            {{ is_state('sensor.<DEVICE NAME>_api_version', 'OK') }}