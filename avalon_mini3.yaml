miners_<DEVICE NAME>:

#
# basic commands to control the miner
#

  shell_command:

    # set miner workmode heater
    <DEVICE NAME>_set_workmode_heater: >-
      /bin/bash -c "echo 'ascset|0,workmode,set,0' | nc -w 2 <IP-ADDRESS> 4028"

    # set miner workmode mining
    <DEVICE NAME>_set_workmode_mining: >-
      /bin/bash -c "echo 'ascset|0,workmode,set,1' | nc -w 2 <IP-ADDRESS> 4028"
      
    # set miner workmode night
    <DEVICE NAME>_set_workmode_night: >-
      /bin/bash -c "echo 'ascset|0,workmode,set,2' | nc -w 2 <IP-ADDRESS> 4028"

    # set miner worklevel heater
    <DEVICE NAME>_set_worklevel_eco: >-
      /bin/bash -c "echo 'ascset|0,worklevel,set,-1' | nc -w 2 <IP-ADDRESS> 4028"

    # set miner worklevel mining
    <DEVICE NAME>_set_worklevel_super: >-
      /bin/bash -c "echo 'ascset|0,worklevel,set,0' | nc -w 2 <IP-ADDRESS> 4028"

    # wake up miner from standby and continue with latest workmode
    <DEVICE NAME>_set_softon: >-
      /bin/bash -c "echo 'ascset|0,softon,1:$(( $(date +%s) + 5 ))' | nc -w 2 <IP-ADDRESS> 4028"

    # send miner to standby
    <DEVICE NAME>_set_softoff: >-
      /bin/bash -c "echo 'ascset|0,softoff,1:$(( $(date +%s) + 5 ))' | nc -w 2 <IP-ADDRESS> 4028"

    # set target temperature (18-31°C)
    <DEVICE NAME>_set_temperature: >-
      /bin/bash -c "echo 'ascset|0,limittemp,{{ temperature }}' | nc -w 2 <IP-ADDRESS> 4028"

    # turn on LCD screen
    <DEVICE NAME>_set_lcdon: >-
      /bin/bash -c "echo 'ascset|0,lcd,0:1' | nc -w 2 <IP-ADDRESS> 4028"

    # turn off LCD screen
    <DEVICE NAME>_set_lcdoff: >-
      /bin/bash -c "echo 'ascset|0,lcd,0:0' | nc -w 2 <IP-ADDRESS> 4028"

    # set LCD brightness
    <DEVICE NAME>_set_lcdbrightness: >-
      /bin/bash -c "echo 'ascset|0,lcd,1:{{ brightness }}' | nc -w 2 <IP-ADDRESS> 4028"

    # set LCD brightness auto on
    <DEVICE NAME>_set_lcdautoon: >-
      /bin/bash -c "echo 'ascset|0,lcd,3:1' | nc -w 2 <IP-ADDRESS> 4028"

    # set LCD brightness auto off
    <DEVICE NAME>_set_lcdautooff: >-
      /bin/bash -c "echo 'ascset|0,lcd,3:0' | nc -w 2 <IP-ADDRESS> 4028"

    # trigger reboot
    <DEVICE NAME>_reboot: >-
      /bin/bash -c "echo 'ascset|0,reboot,0' | nc -w 2 <IP-ADDRESS> 4028"

#
# STEP 1: monitor the API interface and receive JSON raw-data from it
#

  command_line:
    
      # monitors whether the miners api interface is available
    - binary_sensor:
        unique_id: <DEVICE NAME>.Available
        name: "<DEVICE NAME>.Available"
        command: "echo '{\"command\": \"summary\"}' | nc -w 2 <IP-ADDRESS> 4028 > /dev/null && echo online || echo offline"
        payload_on: "online"
        payload_off: "offline"
        device_class: connectivity
        scan_interval: 5
        icon: >-
          {% if value == 'online' %}
            mdi:ethernet
          {% else %}
            mdi:ethernet-off
          {% endif %}

    # get JSON response from cgminer 'stats' command
    - sensor: 
        unique_id: <DEVICE NAME>.api.stats
        name: "<DEVICE NAME>.api.stats"
        icon: mdi:code-json
        command_timeout: 3
        command: >
          output=$(echo '{"command": "stats"}' | nc -w 2 <IP-ADDRESS> 4028);
          if echo "$output" | jq empty >/dev/null 2>&1; then echo "$output"; fi
        scan_interval: 15
        value_template: >
          {% if value_json is defined and value_json.STATS is defined %}
            OK
          {% else %}
            Error
          {% endif %}
        json_attributes:
          - STATS

    # get JSON response from cgminer 'litestats' command 
    - sensor: 
        unique_id: <DEVICE NAME>.api.litestats
        name: "<DEVICE NAME>.api.litestats"
        icon: mdi:code-json
        command_timeout: 3
        command: >
          output=$(echo '{"command": "litestats"}' | nc -w 2 <IP-ADDRESS> 4028);
          if echo "$output" | jq empty >/dev/null 2>&1; then echo "$output"; fi
        scan_interval: 15
        value_template: >
          {% if value_json is defined and value_json.STATS is defined %}
            OK
          {% else %}
            Error
          {% endif %}
        json_attributes:
          - STATS

    # get JSON response from cgminer 'coin' command 
    - sensor: 
        unique_id: <DEVICE NAME>.api.coin
        name: "<DEVICE NAME>.api.coin"
        icon: mdi:code-json
        command_timeout: 3
        command: >
          output=$(echo '{"command": "coin"}' | nc -w 2 <IP-ADDRESS> 4028);
          if echo "$output" | jq empty >/dev/null 2>&1; then echo "$output"; fi
        scan_interval: 15
        value_template: >
          {% if value_json is defined and value_json.COIN is defined %}
            OK
          {% else %}
            Error
          {% endif %}
        json_attributes:
          - COIN

    # get JSON response from cgminer 'summary' command 
    - sensor: 
        unique_id: <DEVICE NAME>.api.summary
        name: "<DEVICE NAME>.api.summary"
        icon: mdi:code-json
        command_timeout: 3
        command: >
          output=$(echo '{"command": "summary"}' | nc -w 2 <IP-ADDRESS> 4028);
          if echo "$output" | jq empty >/dev/null 2>&1; then echo "$output"; fi
        scan_interval: 15
        value_template: >
          {% if value_json is defined and value_json.SUMMARY is defined %}
            OK
          {% else %}
            Error
          {% endif %}
        json_attributes:
          - SUMMARY

    # get JSON response from cgminer 'pools' command 
    - sensor: 
        unique_id: <DEVICE NAME>.api.pools
        name: "<DEVICE NAME>.api.pools"
        icon: mdi:code-json
        command_timeout: 3
        command: >
          output=$(echo '{"command": "pools"}' | nc -w 2 <IP-ADDRESS> 4028);
          if echo "$output" | jq empty >/dev/null 2>&1; then echo "$output"; fi
        scan_interval: 15
        value_template: >
          {% if value_json is defined and value_json.POOLS is defined %}
            OK
          {% else %}
            Error
          {% endif %}
        json_attributes:
          - POOLS

    # get JSON response from cgminer 'devs' command 
    - sensor: 
        unique_id: <DEVICE NAME>.api.devs
        name: "<DEVICE NAME>.api.devs"
        icon: mdi:code-json
        command_timeout: 3
        command: >
          output=$(echo '{"command": "devs"}' | nc -w 2 <IP-ADDRESS> 4028);
          if echo "$output" | jq empty >/dev/null 2>&1; then echo "$output"; fi
        scan_interval: 15
        value_template: >
          {% if value_json is defined and value_json.DEVS is defined %}
            OK
          {% else %}
            Error
          {% endif %}
        json_attributes:
          - DEVS

    # get JSON response from cgminer 'devdetails' command 
    - sensor: 
        unique_id: <DEVICE NAME>.api.devdetails
        name: "<DEVICE NAME>.api.devdetails"
        icon: mdi:code-json
        command_timeout: 3
        command: >
          output=$(echo '{"command": "devdetails"}' | nc -w 2 <IP-ADDRESS> 4028);
          if echo "$output" | jq empty >/dev/null 2>&1; then echo "$output"; fi
        scan_interval: 15
        value_template: >
          {% if value_json is defined and value_json.DEVDETAILS is defined %}
            OK
          {% else %}
            Error
          {% endif %}
        json_attributes:
          - DEVDETAILS
          
    # get JSON response from cgminer 'version' command 
    - sensor: 
        unique_id: <DEVICE NAME>.api.version
        name: "<DEVICE NAME>.api.version"
        icon: mdi:code-json
        command_timeout: 3
        command: >
          output=$(echo '{"command": "version"}' | nc -w 2 <IP-ADDRESS> 4028);
          if echo "$output" | jq empty >/dev/null 2>&1; then echo "$output"; fi
        scan_interval: 15
        value_template: >
          {% if value_json is defined and value_json.VERSION is defined %}
            OK
          {% else %}
            Error
          {% endif %}
        json_attributes:
          - VERSION

    # get JSON response from cgminer 'config' command 
    - sensor: 
        unique_id: <DEVICE NAME>.api.config
        name: "<DEVICE NAME>.api.config"
        icon: mdi:code-json
        command_timeout: 3
        command: >
          output=$(echo '{"command": "config"}' | nc -w 2 <IP-ADDRESS> 4028);
          if echo "$output" | jq empty >/dev/null 2>&1; then echo "$output"; fi
        scan_interval: 15
        value_template: >
          {% if value_json is defined and value_json.CONFIG is defined %}
            OK
          {% else %}
            Error
          {% endif %}
        json_attributes:
          - CONFIG

  # input boolean to switch on/off auto load management used with separate automations
  input_boolean:
    <DEVICE NAME>_auto_load_management:
      name: "<DEVICE NAME>.auto_load_management"
      icon: mdi:auto-mode

#
# STEP 2: create template entities to contol the miner and extract status values from the JSON raw data
#
  template:

    - select:
    
        # select template to set standby and workmode (incl. switching power supply via e.g.seperate power circuit actor)
        - name: "<DEVICE NAME>.Workmode.Set"
          unique_id: <DEVICE NAME>.Workmode.Set
          icon: mdi:cog-play-outline
          state: "{{ states('sensor.<DEVICE NAME>_workmode_status') }}"
          options: "{{ ['Standby', 'Heater-Eco', 'Heater-Super', 'Mining', 'Night'] }}"
          availability: >
            {{ is_state('sensor.<DEVICE NAME>_api_litestats', 'OK') }}
          select_option:
            - choose:
                # switch to standby
                - conditions:
                    - condition: template
                      value_template: "{{ option == 'Standby' }}"
                  sequence:
                    - action: shell_command.<DEVICE NAME>_set_softoff
                    - delay: "00:00:01"
                    - action: homeassistant.update_entity
                      target:
                        entity_id: sensor.<DEVICE NAME>_api_litestats

                # set workmode Heater / Mining / Night
                - conditions:
                    - condition: template
                      value_template: "{{ option in ['Heater-Eco', 'Heater-Super', 'Mining', 'Night'] }}"
                  sequence:
                    # when coming from standby or off ensure active power circuit to the miner PSU
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: >
                                {{ states('sensor.<DEVICE NAME>_workmode_status') in ['Standby', 'Off'] }}

                          sequence:
                            # softon only (without switch for the power circuit)
                            - action: shell_command.<DEVICE NAME>_set_softon
                            - delay: "00:00:03"
                            - action: homeassistant.update_entity
                              target:
                                entity_id: sensor.<DEVICE NAME>_api_litestats
                                        
                            # wait for miner to be up and running before switching to target workmode
                            - delay: "00:01:00"

                    # set target workmode
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ option == 'Heater-Eco' }}"
                          sequence:
                            - action: shell_command.<DEVICE NAME>_set_workmode_heater
                            - delay: "00:00:03"
                            - action: shell_command.<DEVICE NAME>_set_worklevel_eco
                        - conditions:
                            - condition: template
                              value_template: "{{ option == 'Heater-Super' }}"
                          sequence:
                            - action: shell_command.<DEVICE NAME>_set_workmode_heater
                            - delay: "00:00:03"
                            - action: shell_command.<DEVICE NAME>_set_worklevel_super
                        - conditions:
                            - condition: template
                              value_template: "{{ option == 'Mining' }}"
                          sequence:
                            - action: shell_command.<DEVICE NAME>_set_workmode_mining
                        - conditions:
                            - condition: template
                              value_template: "{{ option == 'Night' }}"
                          sequence:
                            - action: shell_command.<DEVICE NAME>_set_workmode_night

                    # turn off LCD display
                    # - delay: "00:00:01"
                    # - action: shell_command.<DEVICE NAME>_set_lcdoff
                    - delay: "00:00:01"
                    - action: homeassistant.update_entity
                      target:
                        entity_id: sensor.<DEVICE NAME>_api_litestats
                        
    # set heating temperature limit
    - number:
        - name: "<DEVICE NAME>.Temperature.Set"
          unique_id: <DEVICE NAME>.Temperature.Set
          icon: mdi:thermometer
          state: "{{ states('sensor.<DEVICE NAME>_limitemp') | int }}"
          availability: >
            {{ is_state('sensor.<DEVICE NAME>_api_litestats', 'OK') }}
          unit_of_measurement: "°C"
          set_value:
            - action: shell_command.<DEVICE NAME>_set_temperature
              data:
                temperature: "{{ value | int }}"
          min: 18
          max: 31
          step: 1

    - switch:
    
        - unique_id: <DEVICE NAME>.LcdOnOff.Switch
          name: "<DEVICE NAME>.LcdOnOff.Switch"
          icon: mdi:overscan
          state: "{{ is_state('binary_sensor.<DEVICE NAME>_lcdonoff_status', 'on') }}"
          turn_on:
            - action: shell_command.<DEVICE NAME>_set_lcdon
            - delay: 1
            - action: homeassistant.update_entity
              target:
                entity_id: sensor.<DEVICE NAME>_api_litestats
          turn_off:
            - action: shell_command.<DEVICE NAME>_set_lcdoff
            - delay: 1
            - action: homeassistant.update_entity
              target:
                entity_id: sensor.<DEVICE NAME>_api_litestats            

    - binary_sensor:
      
      # actual on/off state of the LCD display
      - unique_id: <DEVICE NAME>.LcdOnOff.Status
        name: "<DEVICE NAME>.LcdOnOff.Status"
        icon: mdi:overscan
        state: >
            {% set stats = state_attr('sensor.<DEVICE NAME>_api_litestats', 'STATS') %}
            {% if stats %}
                {% set summary = stats[0].get('MM ID0', '') %}
                {% set match = summary | regex_findall('LcdOnoff\\[(\\d)\\]') %}
                {{ 'on' if match and match[0] == '1' else 'off' }}
            {% else %}
                off
            {% endif %}
        availability: >
            {{ is_state('sensor.<DEVICE NAME>_api_litestats', 'OK') }}

      # actual pool connection state
      - unique_id: <DEVICE NAME>.Pool_Status
        name: "<DEVICE NAME>.Pool_Status"
        device_class: connectivity
        state: >
            {% set pools = state_attr('sensor.<DEVICE NAME>_api_pools', 'POOLS') %}
            {% set status = pools[0]['Status'] if pools and pools[0] is defined and 'Status' in pools[0] else 'unknown' %}
            {{ 'on' if status == 'Alive' else 'off' }}
        icon: >
            {% set pools = state_attr('sensor.<DEVICE NAME>_api_pools', 'POOLS') %}
            {% set status = pools[0]['Status'] if pools and pools[0] is defined and 'Status' in pools[0] else 'unknown' %}
            {{ 'mdi:link-variant' if status == 'Alive' else 'mdi:link-variant-off' }}
        availability: >
            {{ is_state('sensor.<DEVICE NAME>_api_pools', 'OK') }}
        
    - sensor:
    
      # actual system status (number)
      - unique_id: <DEVICE NAME>.State
        name: "<DEVICE NAME>.State"
        icon: mdi:list-status
        state: >
            {% set stats = state_attr('sensor.<DEVICE NAME>_api_litestats', 'STATS') %}
            {% set summary = stats[0]['MM ID0'] if stats and stats[0] is defined and 'MM ID0' in stats[0] else '' %}
            {% set match = summary | regex_findall('STATE\\[([^\\]]+)\\]') %}
            {{ match[0] if match else 'n/a' }}
        availability: >
            {{ is_state('sensor.<DEVICE NAME>_api_litestats', 'OK') }}

      # current temperature inside the device
      - unique_id: <DEVICE NAME>.ITemp
        name: "<DEVICE NAME>.ITemp"
        icon: mdi:thermometer
        device_class: temperature
        unit_of_measurement: "°C"
        state: >
            {% set stats = state_attr('sensor.<DEVICE NAME>_api_litestats', 'STATS') %}
            {% set summary = stats[0]["MM ID0"] if stats else "" %}
            {% set match = summary | regex_findall('ITemp\\[(\\d+)\\]') %}
            {{ match[0] | float if match else 'n/a' }}
        availability: >
            {{ is_state('sensor.<DEVICE NAME>_api_litestats', 'OK') }}

      # current output temperature
      - unique_id: <DEVICE NAME>.OTemp
        name: "<DEVICE NAME>.OTemp"
        icon: mdi:thermometer
        device_class: temperature
        unit_of_measurement: "°C"
        state: >
            {% set stats = state_attr('sensor.<DEVICE NAME>_api_litestats', 'STATS') %}
            {% set summary = stats[0]["MM ID0"] if stats else "" %}
            {% set match = summary | regex_findall('OTemp\\[(\\d+)\\]') %}
            {{ match[0] | float if match else 'n/a' }}
        availability: >
            {{ is_state('sensor.<DEVICE NAME>_api_litestats', 'OK') }}

      # current limit temperature
      - unique_id: <DEVICE NAME>.Limitemp
        name: "<DEVICE NAME>.Limitemp"
        icon: mdi:thermometer
        device_class: temperature
        unit_of_measurement: "°C"
        state: >
            {% set stats = state_attr('sensor.<DEVICE NAME>_api_litestats', 'STATS') %}
            {% set summary = stats[0]["MM ID0"] if stats else "" %}
            {% set match = summary | regex_findall('Limitemp\\[(\\d+)\\]') %}
            {{ match[0] | float if match else 'n/a' }}
        availability: >
            {{ is_state('sensor.<DEVICE NAME>_api_litestats', 'OK') }}

      # relative fan speed total (%) 
      - unique_id: <DEVICE NAME>.FanR
        name: "<DEVICE NAME>.FanR"
        icon: mdi:fan
        unit_of_measurement: "%"
        state: >
            {% set stats = state_attr('sensor.<DEVICE NAME>_api_litestats', 'STATS') %}
            {% set summary = stats[0]["MM ID0"] if stats else "" %}
            {% set match = summary | regex_findall('FanR\\[(\\d+)%\\]') %}
            {{ match[0] | int if match else 0 }}

      # filter runtime (min)
      - unique_id: <DEVICE NAME>.Filter
        name: "<DEVICE NAME>.Filter"
        icon: mdi:air-filter
        device_class: duration
        unit_of_measurement: "min"
        state: >
            {% set stats = state_attr('sensor.<DEVICE NAME>_api_litestats', 'STATS') %}
            {% set summary = stats[0]["MM ID0"] if stats else "" %}
            {% set match = summary | regex_findall('Filter\\[(\\d+)\\]') %}
            {{ match[0] | int if match else 0 }}
        availability: >
            {{ is_state('sensor.<DEVICE NAME>_api_litestats', 'OK') }}

      # current hashrate (TH/s)
      - unique_id: <DEVICE NAME>.THSspd
        name: "<DEVICE NAME>.THSspd"
        icon: mdi:speedometer
        unit_of_measurement: "TH/s"
        state: >
            {% set stats = state_attr('sensor.<DEVICE NAME>_api_litestats', 'STATS') %}
            {% set summary = stats[0]["MM ID0"] if stats else "" %}
            {% set match = summary | regex_findall('GHSspd\\[(\\d+\\.\\d+)\\]') %}
            {{ (match[0] | float / 1000) | round(2) if match else 0 }}

      # actual worklevel status
      - unique_id: <DEVICE NAME>.Worklevel
        name: "<DEVICE NAME>.Worklevel"
        icon: mdi:cog-play-outline
        state: >
            {% set stats = state_attr('sensor.<DEVICE NAME>_api_litestats', 'STATS') %}
            {% set summary = stats[0]["MM ID0"] if stats else "" %}
            {% set match = summary | regex_findall('LEVEL\\[([^\\]]+)\\]') %}
            {% if match %}
               {% set level = match[0] %}
               {% if level == '-1' %}
                  Eco
               {% elif level == '0' %}
                  Super
               {% endif %}
            {% endif %}    
        availability: >
            {{ is_state('sensor.<DEVICE NAME>_api_litestats', 'OK') }}
          
      # actual workmode status
      - unique_id: <DEVICE NAME>.Workmode.Status
        name: "<DEVICE NAME>.Workmode.Status"
        icon: mdi:cog-play-outline
        state: >
            {% set stats = state_attr('sensor.<DEVICE NAME>_api_litestats', 'STATS') %}
            {% set summary = stats[0]["MM ID0"] if stats else "" %}
            {% set match_state = summary | regex_findall('STATE\\[(\\d+)\\]') %}
            {% if match_state %}
               {% set state = match_state[0] %}
               {% if state == '2' %}
                  Standby
               {% else %}
                    {% set match_mode = summary | regex_findall('MODE\\[(\\d+)\\]') %}            
                    {% if match_mode %}
                       {% set mode = match_mode[0] %}
                       {% if mode == '0' %}
                            {% set match_level = summary | regex_findall('LEVEL\\[([^\\]]+)\\]') %}
                            {% set level = match_level[0] %}
                                {% if level == '-1' %}
                                   Heater-Eco
                                {% elif level == '0' %}
                                   Heater-Super
                                {% endif %}
                       {% elif mode == '1' %}
                          Mining
                       {% elif mode == '2' %}
                          Night
                       {% endif %}
                    {% endif %}                    
               {% endif %}
            {% endif %}
          

      # current blockchain network difficulty
      - unique_id: <DEVICE NAME>.Network_Difficulty
        name: "<DEVICE NAME>.Network_Difficulty"
        icon: mdi:calculator-variant-outline
        unit_of_measurement: "T"
        state: >
            {% set coin = state_attr('sensor.<DEVICE NAME>_api_coin', 'COIN') %}
            {% if coin and 'Network Difficulty' in coin[0] %}
                {% set difficulty = coin[0]['Network Difficulty'] | float %}
                {{ (difficulty / 1_000_000_000_000) | round(2) }}
            {% else %}
                n/a
            {% endif %}
        availability: >
            {{ is_state('sensor.<DEVICE NAME>_api_coin', 'OK') }}

      # number of found blocks by the device
      - unique_id: <DEVICE NAME>.Found_Blocks
        name: "<DEVICE NAME>.Found_Blocks"
        icon: mdi:cube-outline
        state: >
            {% set summary = state_attr('sensor.<DEVICE NAME>_api_summary', 'SUMMARY') %}
            {% if summary and 'Found Blocks' in summary[0] %}
                {{ summary[0]['Found Blocks'] | int }}
            {% else %}
                0
            {% endif %}

      # total number of hardware errors since startup
      - unique_id: <DEVICE NAME>.Hardware_Errors
        name: "<DEVICE NAME>.Hardware_Errors"
        icon: mdi:alert-outline
        unit_of_measurement: " "
        state: >
            {% set summary = state_attr('sensor.<DEVICE NAME>_api_summary', 'SUMMARY') %}
            {% if summary and 'Hardware Errors' in summary[0] %}
                {{ summary[0]['Hardware Errors'] | int }}
            {% else %}
                0
            {% endif %}
        availability: >
            {{ is_state('sensor.<DEVICE NAME>_api_summary', 'OK') }}

      # avg number of shares per minute
      - unique_id: <DEVICE NAME>.Avg_Shares_per_Min
        name: "<DEVICE NAME>.Avg_Shares_per_Min"
        icon: mdi:timer-outline
        unit_of_measurement: " "
        state: >
            {% set summary = state_attr('sensor.<DEVICE NAME>_api_summary', 'SUMMARY') %}
            {% if summary and 'Utility' in summary[0] %}
                {{ summary[0]['Utility'] | float }}
            {% else %}
                0
            {% endif %}
        availability: >
            {{ is_state('sensor.<DEVICE NAME>_api_summary', 'OK') }}

      # ratio of hardware errors to total number of shares
      - unique_id: <DEVICE NAME>.Hardware_ErrorsR
        name: "<DEVICE NAME>.Hardware_ErrorsR"
        icon: mdi:alert-outline
        unit_of_measurement: "%"
        state: >
            {% set summary = state_attr('sensor.<DEVICE NAME>_api_summary', 'SUMMARY') %}
            {% if summary and 'Device Hardware%' in summary[0] %}
                {{ summary[0]['Device Hardware%'] | float | round(2) }}
            {% else %}
                0
            {% endif %}
        availability: >
            {{ is_state('sensor.<DEVICE NAME>_api_summary', 'OK') }}

      # URL of the pool
      - unique_id: <DEVICE NAME>.Pool
        name: "<DEVICE NAME>.Pool"
        icon: mdi:pool
        state: >
            {% set pools = state_attr('sensor.<DEVICE NAME>_api_pools', 'POOLS') %}
            {{ pools[0]['Stratum URL'] if pools and 'Stratum URL' in pools[0] else 'n/a' }}
        availability: >
            {{ is_state('sensor.<DEVICE NAME>_api_pools', 'OK') }}

      # total number of accepted shares since startup
      - unique_id: <DEVICE NAME>.Accepted_Shares
        name: "<DEVICE NAME>.Accepted_Shares"
        icon: mdi:sticker-check
        unit_of_measurement: " "
        state: >
            {% set pools = state_attr('sensor.<DEVICE NAME>_api_pools', 'POOLS') %}
            {{ pools[0]['Accepted'] | int if pools and 'Accepted' in pools[0] else 'n/a' }}
        availability: >
            {{ is_state('sensor.<DEVICE NAME>_api_pools', 'OK') }}

      # total number of rejected shares since startup
      - unique_id: <DEVICE NAME>.Rejected_Shares
        name: "<DEVICE NAME>.Rejected_Shares"
        icon: mdi:sticker-remove-outline
        unit_of_measurement: " "
        state: >
            {% set pools = state_attr('sensor.<DEVICE NAME>_api_pools', 'POOLS') %}
            {{ pools[0]['Rejected'] | int if pools and 'Rejected' in pools[0] else 'n/a' }}
        availability: >
            {{ is_state('sensor.<DEVICE NAME>_api_pools', 'OK') }}

      # pool rejection rate
      - unique_id: <DEVICE NAME>.Rejection_Rate
        name: "<DEVICE NAME>.Rejection_Rate"
        icon: mdi:trash-can-outline
        unit_of_measurement: "%"
        state: >
            {% set pools = state_attr('sensor.<DEVICE NAME>_api_pools', 'POOLS') %}
            {% if pools and 'Pool Rejected%' in pools[0] %}
                {{ pools[0]['Pool Rejected%'] | float | round(2) }}
            {% else %}
                n/a
            {% endif %}
        availability: >
            {{ is_state('sensor.<DEVICE NAME>_api_pools', 'OK') }}

      # time elapsed since latest share accepted
      - unique_id: <DEVICE NAME>.Latest_Share
        name: "<DEVICE NAME>.Latest_Share"
        icon: mdi:clock-check
        unit_of_measurement: "s"
        device_class: duration
        state: >
            {% set pools = state_attr('sensor.<DEVICE NAME>_api_pools', 'POOLS') %}
            {% set stats = state_attr('sensor.<DEVICE NAME>_api_litestats', 'STATS') %}
            {% set summary = stats[0]["MM ID0"] if stats else "" %}
            {% set uptime_match = summary | regex_findall('Elapsed\\[([^\\]]+)\\]') %}
            {% set uptime = uptime_match[0] | int(0) if uptime_match else 0 %}
            {% if pools and 'Last Share Time' in pools[0] %}
                {% set share_time = pools[0]['Last Share Time'] | int(0) %}
                {% set diff = uptime - share_time %}
                {{ diff | int }}
            {% else %}
                n/a
            {% endif %}
        availability: >
            {{ is_state('sensor.<DEVICE NAME>_api_pools', 'OK') and is_state('sensor.<DEVICE NAME>_api_litestats', 'OK') }}

      # current stratum difficulty in G
      - unique_id: <DEVICE NAME>.Stratum_Difficulty
        name: "<DEVICE NAME>.Stratum_Difficulty"
        icon: mdi:calculator-variant-outline
        unit_of_measurement: " "
        state: >
            {% set pools = state_attr('sensor.<DEVICE NAME>_api_pools', 'POOLS') %}
            {{ (pools[0]['Stratum Difficulty'] | float) | round(2) if pools and 'Stratum Difficulty' in pools[0] else 'n/a' }}
        availability: >
            {{ is_state('sensor.<DEVICE NAME>_api_pools', 'OK') }}

      # CGMiner Software Version
      - unique_id: <DEVICE NAME>.CGMiner_Version
        name: "<DEVICE NAME>.CGMiner_Version"
        icon: mdi:counter
        state: >
            {% set version_data = state_attr('sensor.<DEVICE NAME>_api_version', 'VERSION') %}
            {{ version_data[0]['CGMiner'] if version_data and 'CGMiner' in version_data[0] else 'n/a' }}
        availability: >
            {{ is_state('sensor.<DEVICE NAME>_api_version', 'OK') }}

